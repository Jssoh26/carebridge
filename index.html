<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareBridge</title>
<meta name="description" content="CareBridge: one connected caregiver journey. Student prototype for caregivers of older adults in Singapore.">
<meta name="theme-color" content="#0b6b66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CareBridge">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="CareBridge">
<meta property="og:description" content="One connected caregiver journey. Student prototype with demo data.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600&display=swap">
<style>
html, body { margin: 0; height: 100%; }
body { font: 14px system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* CareBridge — calm public-service palette. Layout: phone frame centred, presenter rail beside it on wide screens. */
:root {
  --bg: #eef3f2;
  --stage: #dfe8e6;
  --surface: #ffffff;
  --surface-2: #f6f9f8;
  --ink: #102a2c;
  --muted: #4b6265;
  --line: #d3dfdd;
  --accent: #0b6b66;
  --accent-ink: #ffffff;
  --accent-soft: #dff0ed;
  --kopi: #8a4b1c;
  --kopi-soft: #f6eadf;
  --ok: #1b7443;
  --ok-soft: #e1f2e8;
  --warn: #9a5a00;
  --warn-soft: #fbf0dc;
  --danger: #b42318;
  --danger-soft: #fde8e6;
  --info: #24529f;
  --info-soft: #e5edfa;
  --shadow: 0 1px 2px rgba(16, 42, 44, .06), 0 4px 14px rgba(16, 42, 44, .06);
  --display: 'Lexend', 'Segoe UI', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1718; --stage: #081011; --surface: #152325; --surface-2: #1b2c2e; --ink: #e7f0ef; --muted: #a3b8b7; --line: #2c3f41;
    --accent: #56c3b9; --accent-ink: #062a27; --accent-soft: #173b39; --kopi: #e4a46d; --kopi-soft: #3a2a1d;
    --ok: #6fd39b; --ok-soft: #173426; --warn: #f0b75a; --warn-soft: #3a2c14; --danger: #ff8a80; --danger-soft: #3d1c1a;
    --info: #8fb3f5; --info-soft: #1b2a45; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1718; --stage: #081011; --surface: #152325; --surface-2: #1b2c2e; --ink: #e7f0ef; --muted: #a3b8b7; --line: #2c3f41;
  --accent: #56c3b9; --accent-ink: #062a27; --accent-soft: #173b39; --kopi: #e4a46d; --kopi-soft: #3a2a1d;
  --ok: #6fd39b; --ok-soft: #173426; --warn: #f0b75a; --warn-soft: #3a2c14; --danger: #ff8a80; --danger-soft: #3d1c1a;
  --info: #8fb3f5; --info-soft: #1b2a45; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--stage); color: var(--ink); font-family: var(--body); }
#root { height: 100%; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Stage ---------- */
.stage { min-height: 100%; display: flex; justify-content: center; align-items: center; gap: 40px; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone { width: 390px; height: 844px; max-height: calc(100vh - 48px); min-height: 640px; border-radius: 46px; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 0 0 10px #1b2022, 0 0 0 11px #3a4245, 0 30px 70px rgba(0,0,0,.28); flex-shrink: 0; }
.statusbar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font: 600 15px var(--display); color: var(--ink); position: relative; z-index: 6; background: var(--bg); }
.statusbar .notch { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 112px; height: 30px; border-radius: 20px; background: #0b0d0e; }
@media (max-width: 900px) {
  .stage { padding: 0; gap: 0; align-items: stretch; min-height: 100%; height: 100%; }
  .phone { width: 100%; height: 100%; max-height: none; min-height: 0; border-radius: 0; box-shadow: none; }
  .statusbar { display: none; }
  .rail { display: none !important; }
}

/* ---------- App shell ---------- */
.app { font-size: calc(17px * var(--scale, 1)); line-height: 1.45; height: 100%; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); position: relative; }
.app[data-contrast="high"] { --muted: var(--ink); --line: var(--ink); --surface-2: var(--surface); }
.app[data-contrast="high"] .card, .app[data-contrast="high"] .btn-secondary { border-width: 2px; }
.phone .app { height: calc(100% - 44px); }
@media (max-width: 900px) { .phone .app { height: 100%; } }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
.screen-inner { padding: 4px 18px 28px; display: flex; flex-direction: column; gap: 16px; }

.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px 18px; min-height: 60px; background: var(--bg); position: sticky; top: 0; z-index: 4; }
.topbar h1 { font: 600 1.15em/1.2 var(--display); margin: 0; flex: 1; min-width: 0; text-wrap: balance; letter-spacing: -.01em; }
.iconbtn { width: 48px; height: 48px; border-radius: 14px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; position: relative; color: var(--ink); flex-shrink: 0; }
.iconbtn:hover { background: var(--surface); }
.iconbtn .dot { position: absolute; top: 9px; right: 9px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font: 700 11px/18px var(--body); text-align: center; border: 2px solid var(--bg); }

.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); flex-shrink: 0; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; color: var(--muted); font: 600 .7em var(--body); border-radius: 12px; min-height: 56px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] .tabicon { background: var(--accent-soft); }
.tab.kopi[aria-current="page"] { color: var(--kopi); }
.tab.kopi[aria-current="page"] .tabicon { background: var(--kopi-soft); }
.tabicon { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; }

/* ---------- Type ---------- */
.h-xl { font: 600 1.55em/1.15 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.h-lg { font: 600 1.25em/1.2 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.h-md { font: 600 1.05em/1.25 var(--display); margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85em; }
.tiny { font-size: .76em; }
.eyebrow { font: 700 .72em var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.strike { text-decoration: line-through; }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.tap { cursor: pointer; text-align: left; width: 100%; font: inherit; }
.card.tap:hover { border-color: var(--accent); }
.card.hero { background: var(--accent); color: var(--accent-ink); border: 0; }
.card.hero .muted { color: inherit; opacity: .85; }
.card.kopi { background: var(--kopi-soft); border-color: transparent; }
.card.alert { background: var(--info-soft); border-color: transparent; }
.card.warn { background: var(--warn-soft); border-color: transparent; }
.card.danger { background: var(--danger-soft); border-color: transparent; }
.card.ok { background: var(--ok-soft); border-color: transparent; }
.row { display: flex; align-items: center; gap: 12px; }
.row.top { align-items: flex-start; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.tight { gap: 4px; }
.stack.loose { gap: 16px; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 58px; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; font: inherit; }
.li:hover { background: var(--surface-2); }
.li.static { cursor: default; }
.li.static:hover { background: none; }
.ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0; background: var(--accent-soft); color: var(--accent); }
.ico.kopi { background: var(--kopi-soft); color: var(--kopi); }
.ico.ok { background: var(--ok-soft); color: var(--ok); }
.ico.warn { background: var(--warn-soft); color: var(--warn); }
.ico.danger { background: var(--danger-soft); color: var(--danger); }
.ico.info { background: var(--info-soft); color: var(--info); }

/* ---------- Controls ---------- */
.btn { min-height: 54px; border-radius: 16px; border: 0; padding: 12px 18px; font: 600 1em var(--display); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-kopi { background: var(--kopi); color: #fff; }
.app[data-dark="1"] .btn-kopi { color: #2a1708; }
.btn-secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn-ghost { background: transparent; color: var(--accent); min-height: 46px; padding: 8px 10px; }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; padding: 8px 14px; font-size: .9em; border-radius: 13px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }

.chip { min-height: 44px; padding: 8px 14px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--surface); font: 600 .88em var(--body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
.chips.scroll .chip { flex-shrink: 0; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font: 700 .74em var(--body); letter-spacing: .02em; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.kopi { background: var(--kopi-soft); color: var(--kopi); }
.sim { display: inline-flex; align-items: center; gap: 5px; font: 700 .7em var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 3px 8px; border-radius: 6px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: .9em; }
.input { min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; font: inherit; width: 100%; }
.input:focus { border-color: var(--accent); outline: none; }
.input.err { border-color: var(--danger); }
.err-text { color: var(--danger); font-size: .85em; font-weight: 700; }

.toggle { width: 56px; height: 32px; border-radius: 16px; background: var(--line); border: 0; position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(24px); }

.check { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; flex-shrink: 0; background: var(--surface); color: transparent; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; min-height: 42px; border-radius: 10px; font: 600 .9em var(--body); cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- Bits ---------- */
.kv { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr); gap: 8px 12px; font-size: .92em; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.reason { display: flex; gap: 8px; align-items: flex-start; font-size: .92em; }
.reason svg { flex-shrink: 0; margin-top: 2px; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.price-big { font: 600 2em/1 var(--display); letter-spacing: -.02em; }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--accent); }

/* Bridge journey tracker */
.bridge { display: grid; grid-template-columns: repeat(5, 1fr); position: relative; padding-top: 4px; }
.bridge::before { content: ""; position: absolute; left: 10%; right: 10%; top: 19px; height: 4px; border-radius: 2px; background: var(--line); }
.bridge .fill { position: absolute; left: 10%; top: 19px; height: 4px; border-radius: 2px; background: var(--accent); transition: width .6s ease; }
.bnode { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 1; text-align: center; }
.bnode b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2.5px solid var(--line); color: var(--muted); }
.bnode.on b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bnode span { font: 700 .62em var(--body); letter-spacing: .02em; color: var(--muted); }
.bnode.on span { color: var(--ink); }

/* Calendar grid */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font: 700 .7em var(--body); color: var(--muted); padding: 4px 0; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 12px; background: var(--surface); font: 600 .9em var(--body); cursor: pointer; position: relative; color: var(--ink); min-height: 40px; }
.cal button:disabled { background: transparent; color: var(--muted); opacity: .45; cursor: not-allowed; }
.cal button.sel { background: var(--accent); color: var(--accent-ink); }
.cal button.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal button .dots { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.cal button .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.cal button.sel .dots i { background: var(--accent-ink); }

.timeline { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.tl-item:first-child { border-top: 0; }
.tl-time { font: 700 .85em var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Overlays */
.banner { position: absolute; top: 8px; left: 10px; right: 10px; z-index: 30; background: var(--surface); border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.25); border: 1px solid var(--line); padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; font: inherit; color: var(--ink); animation: drop .35s ease; }
@keyframes drop { from { transform: translateY(-120%); } to { transform: none; } }
.toast { position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 31; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; font-weight: 700; text-align: center; animation: fade .25s; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(8, 20, 21, .45); z-index: 20; display: flex; align-items: flex-end; animation: fadebg .2s; }
@keyframes fadebg { from { opacity: 0; } }
.sheet { background: var(--bg); width: 100%; max-height: 88%; border-radius: 26px 26px 0 0; overflow-y: auto; padding: 10px 18px 24px; display: flex; flex-direction: column; gap: 14px; animation: up .28s ease; }
@keyframes up { from { transform: translateY(100%); } }
.grabber { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 4px; }

/* Splash & onboarding */
.splash { flex: 1; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.welcome-art { border-radius: 26px; background: var(--accent-soft); padding: 26px 18px; display: grid; place-items: center; }
.singpass-btn { background: #f4333d; color: #fff; }
.singpass-mark { font: 800 1.05em var(--display); letter-spacing: -.02em; }

/* Kopi-Talk */
.mic-wrap { display: grid; place-items: center; padding: 6px 0; }
.mic { width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--kopi); color: #fff; display: grid; place-items: center; cursor: pointer; position: relative; box-shadow: 0 10px 30px rgba(138, 75, 28, .35); }
.app[data-dark="1"] .mic { color: #2a1708; }
.mic.listening::before, .mic.listening::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 3px solid var(--kopi); opacity: .5; animation: ring 1.4s ease-out infinite; }
.mic.listening::after { animation-delay: .7s; }
@keyframes ring { from { transform: scale(.85); opacity: .7; } to { transform: scale(1.25); opacity: 0; } }
.wave { display: flex; gap: 4px; align-items: center; height: 34px; justify-content: center; }
.wave i { width: 5px; border-radius: 3px; background: var(--kopi); animation: wv .9s ease-in-out infinite; }
@keyframes wv { 0%, 100% { height: 6px; } 50% { height: 30px; } }
.bubble { max-width: 88%; padding: 12px 14px; border-radius: 18px; white-space: pre-line; }
.bubble.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.bubble.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.bubble.system { align-self: center; background: var(--surface-2); font-size: .82em; color: var(--muted); text-align: center; }
.understood { display: flex; flex-wrap: wrap; gap: 6px; }
.typing { display: inline-flex; gap: 4px; padding: 14px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: tp 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes tp { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

.progress-list { display: flex; flex-direction: column; gap: 12px; }
.progress-list .li { padding: 0; min-height: 40px; cursor: default; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Presenter rail */
.rail { width: 320px; max-height: calc(100vh - 48px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; font-size: 14px; color: var(--ink); }
.rail .card { border-radius: 16px; padding: 14px; gap: 8px; }
.rail h2 { font: 600 18px var(--display); margin: 0; }
.rail button.rb { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; cursor: pointer; font: 600 13.5px var(--body); color: var(--ink); display: flex; gap: 8px; align-items: center; }
.rail button.rb:hover { border-color: var(--accent); }
.rail .brand { display: flex; align-items: center; gap: 10px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* v2 additions */
.topsub { display: block; font: 600 .62em/1.2 var(--body); color: var(--muted); letter-spacing: .01em; margin-top: 2px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; font: inherit; color: var(--ink); min-height: 150px; box-shadow: var(--shadow); position: relative; }
.fcard:hover { border-color: var(--accent); }
.fcard .fname { font: 600 1.02em/1.15 var(--display); margin-top: 6px; }
.fcard .fdesc { font: 700 .74em/1.25 var(--body); color: var(--muted); letter-spacing: .01em; }
.fcard .fblurb { font-size: .8em; line-height: 1.35; }
.fcard .pill { position: absolute; top: 12px; right: 12px; font-size: .62em; padding: 2px 7px; }
.ask-kopi { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; border-radius: 22px; padding: 14px 16px; background: var(--kopi); color: #fff; cursor: pointer; text-align: left; font: inherit; min-height: 76px; }
.app[data-dark="1"] .ask-kopi { color: #2a1708; }
.ask-kopi .micdot { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; flex-shrink: 0; }
.typetiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.typetile { border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font: 700 .76em/1.2 var(--body); color: var(--ink); text-align: center; min-height: 84px; justify-content: center; }
.typetile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pricegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 10px; }
.pricegrid div { display: flex; flex-direction: column; gap: 2px; }
.pricegrid span { font-size: .7em; color: var(--muted); font-weight: 700; }
.pricegrid b { font-variant-numeric: tabular-nums; }
.section-q { font: 700 .72em var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.app[data-simple="1"] .btn { min-height: 64px; font-size: 1.05em; }
.app[data-simple="1"] .chip { min-height: 52px; font-size: .95em; }
.app[data-simple="1"] .li { min-height: 68px; }
.app[data-simple="1"] .tab { font-size: .76em; }
.bubble { font-size: 1.04em; line-height: 1.5; }
.bubble.system { font-size: .8em; }

@media (max-width: 900px) { .phone .app { padding-top: env(safe-area-inset-top, 0px); } }
</style>
